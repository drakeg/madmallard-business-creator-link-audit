{% extends 'audit/base.html' %}{% block content %}<p class="eyebrow">Your account</p><h1>Profile & security</h1><p class="muted">{{ user.username }} · {% if user.is_staff %}Administrator{% else %}Customer{% endif %}</p><div class="split"><section class="card" aria-labelledby="profile-heading"><h2 id="profile-heading">Profile</h2><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<button type="submit">Save profile</button></form></section><section class="card" aria-labelledby="password-heading"><h2 id="password-heading">Change password</h2><form method="post" novalidate>{% csrf_token %}<input type="hidden" name="action" value="password">{{ password_form.as_p }}<button type="submit">Update password</button></form></section></div>{% endblock %}
